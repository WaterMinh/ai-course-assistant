{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-lg-10 mx-auto">
        <div class="card shadow border-0 rounded-4">
            <div class="card-body p-4">
                <h3 class="fw-bold mb-2">
                    Course Summary
                </h3>

                <div class="text-muted mb-4">
                    {{ course.course_code }} - {{ course.course_name }}
                </div>

                <form method="post" class="d-flex gap-2 mb-4">
                    <select class="form-select" name="language" style="max-width: 220px;">
                        <option value="English">English</option>
                        <option value="Vietnamese">Vietnamese</option>
                        <option value="Traditional Chinese">Traditional Chinese</option>
                    </select>

                    <button class="btn btn-primary">
                        Generate Summary
                    </button>

                    <a
                        class="btn btn-outline-secondary"
                        href="/courses/{{ course.id }}/chat"
                    >
                        Back to Course Chat
                    </a>
                </form>

                {% if summary %}
                    <div class="bot-message w-100" style="max-width: 100%;">
                        {{ summary }}
                    </div>
                {% else %}
                    <div class="alert alert-info">
                        Click Generate Summary to summarize this course's uploaded documents.
                    </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
