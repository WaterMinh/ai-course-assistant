<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>AI Course Assistant</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link href="/static/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
            AI Course Assistant
        </a>

        <div class="d-flex gap-2">
            {% if user %}
                <a class="btn btn-outline-light btn-sm" href="/">General Chat</a>
                <a class="btn btn-outline-light btn-sm" href="/courses">Courses</a>
                <a class="btn btn-outline-light btn-sm" href="/history">History</a>

                {% if user.role == "admin" %}
                    <a class="btn btn-warning btn-sm" href="/admin">Admin</a>
                {% endif %}

                <a class="btn btn-danger btn-sm" href="/logout">Logout</a>
            {% endif %}
        </div>
    </div>
</nav>

<main class="container py-4">
    {% block content %}{% endblock %}
</main>
</body>
</html>
